name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Terraform State를 동시에 여러 Workflow가 사용하지 않도록 제한
concurrency:
  group: terraform-aws-infra
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_domain_name: ${{ vars.TF_VAR_domain_name }}
      TF_VAR_admin_cidrs: ${{ vars.TF_VAR_admin_cidrs }}
      TF_VAR_admin_role_arn: ${{ vars.TF_VAR_admin_role_arn }}
      TF_VAR_alert_email: ${{ vars.TF_VAR_alert_email }}

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color